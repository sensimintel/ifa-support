# Grafana 看板自动加载：从固定目录读 dashboards/*.json（数据源统一 uid=prometheus，本机 9091）。
apiVersion: 1
providers:
  - name: g4-vllm
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
