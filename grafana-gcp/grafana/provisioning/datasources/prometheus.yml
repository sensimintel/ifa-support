# Grafana 数据源自动配置：唯一数据源 = 本机 Prometheus。
# network_mode: host 下容器共享宿主 loopback，直接读 127.0.0.1 上的端口。
# 默认 9091（本机 9090 被 mihomo 占用）。
apiVersion: 1
# g4 联邦观测已废弃：主动清掉历史 provision 进库的 g4-01 数据源（幂等，不存在则跳过）。
deleteDatasources:
  - name: g4-01 Prometheus (算力)
    orgId: 1
datasources:
  - name: 5090 Prometheus (本机)
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:${LOCAL_PROM_PORT}
    isDefault: true
    editable: false
