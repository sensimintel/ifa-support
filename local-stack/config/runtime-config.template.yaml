# odyss-services 本地闭环运行配置模板。
# bootstrap.sh 每次执行都会从本模板重新渲染 runtime-config.yaml（密钥持久化在
# config/secrets.env，重渲染不换密钥），替换以下占位符：
#   __PASSWORD_KEY_ID__ / __PASSWORD_KEY_B64__ / __TOKEN_SECRET__   身份密钥（首次生成后不变）
#   __LLM_BASE_URL__ / __LLM_API_KEY__                              LLM 端点（按 LLM_MODE 渲染）
#   __REALTIME_MODEL__ / __MEAL_MODEL__ / __CHUNK_MODEL__           模型名（按 LLM_MODE 渲染）
#   __CHUNK_INHOUSE_ENABLED__                                       real 模式 true，mock 模式 false
# 其余凭据只作用于栈内容器（postgres/redis/minio 均不对公网暴露），保持默认即可。
# ⚠️ meal 注意：services（ifa）内置 workflow 的 meal 节点直接写 VLM_MODEL 真名（2026-07-31
# 起不再用 gemini 别名），__MEAL_MODEL__ 只对使用 ${domain.analysis.meal_model} 占位符的
# workflow 生效；模型名须与远端 vLLM 的 served-model-name 一致。

infra:
  http:
    addr: ":8080"
    log_timezone: Asia/Shanghai
    service_tokens:
      device_image_uri_upload: local-image-uri-service-token
      # ifa 深体验区演示状态机：dx-backend（8070）代理控制面调 services 的固定 token。
      # 闭环内网使用，与 dx_backend.py 的 IFA_DEMO_CONTROL_TOKEN 保持一致即可。
      ifa_demo_control: local-ifa-demo-control-token
  database:
    url: postgres://odyss:odyssadmin@postgres:5432/odyss_services?sslmode=disable
  redis:
    url: redis://:odyssadmin@redis:6379/0
  object_store:
    endpoint: http://minio:9000
    access_key_id: odyss
    secret_access_key: odyssadmin
    bucket: odyss-local
    static_bucket: odyss-local
    use_path_style: true
    region: us-east-1
  llm:
    provider: odyss_llm
    base_url: __LLM_BASE_URL__
    api_key: __LLM_API_KEY__
    retry_max_attempts: 3
    retry_initial_delay_millis: 500
    retry_max_delay_millis: 5000
  geocoding:
    provider: ""
    base_url: ""
    api_key: ""
    language_code: en
    region_code: US
    request_timeout_seconds: 5
  mail:
    # 闭环环境不配 SMTP：配合 dev_expose_code=true，验证码直接从 send-code 响应返回
    smtp_host: ""
    smtp_port: 0
    smtp_proxy_addr: ""
    smtp_user: ""
    smtp_password: ""
    from_email: ""
    use_ssl: false
    start_tls: false
    max_retries: 0
    retry_delay_seconds: 0
    connection_timeout_seconds: 0
    send_timeout_seconds: 0
  delivery:
    mode: local_fake
    request_timeout_seconds: 0
    retry_delay_seconds: 60
    user_state_refresh_interval_seconds: 30
    user_state_refresh_limit: 100
    cleanup_interval_seconds: 0
    cleanup_limit: 1000
    push_target_stale_days: 270
    fcm:
      enabled: false
      endpoint: ""
      project_id: ""
      token_url: ""
      access_token: ""
      service_account_json: ""
      service_account_file: ""
domain:
  analysis:
    model: __REALTIME_MODEL__
    meal_model: __MEAL_MODEL__
    prompt_language: en
    realtime_interval_seconds: 30
    # chunk 分析通道：mock 模式 gate 关闭（chunk 走 llm-mock 的远端通道）；
    # real 模式 gate 开启，直连 llm-tunnel 后面的真实 vLLM。
    chunk_inhouse:
      enabled: __CHUNK_INHOUSE_ENABLED__
      base_url: __LLM_BASE_URL__
      api_key: __LLM_API_KEY__
      model: __CHUNK_MODEL__
      request_timeout_seconds: 120
    realtime_chunk_concurrency: 3
    media_read_timeout_seconds: 15
  user:
    auth:
      token_secret: __TOKEN_SECRET__
      access_token_ttl_seconds: 14400
      refresh_token_ttl_seconds: 2592000
      admin_refresh_token_ttl_seconds: 86400
      verification_ttl_seconds: 600
      reset_token_ttl_seconds: 300
      # 验证码直接在 send-code 响应返回（无邮件通道的闭环环境必须为 true）
      dev_expose_code: true
      cloudflare_access:
        team_domain: ""
        audience: ""
    subscription:
      default_plan: premium
    static_files:
      base_url: ""
    password:
      key_id: __PASSWORD_KEY_ID__
      private_key_b64: "__PASSWORD_KEY_B64__"
      required: false
      max_skew_seconds: 300
