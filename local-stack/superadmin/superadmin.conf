server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由兜底
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 运行时配置不缓存，改配置立即生效
    location = /superadmin-runtime-config.json {
        add_header Cache-Control "no-store";
    }

    # admin API 同域反代到 services，零 CORS。
    # 上游必须写成「变量 + Docker 内置 DNS resolver」：静态 proxy_pass 只在 nginx 启动时
    # 解析一次，services 容器重建换 IP 后会一直打旧 IP（502 connection refused），
    # 变量形式让每次请求都按 TTL 重新解析。
    # 上游名用 compose 服务名 odyss-services（而非 container_name），任何栈命名下都成立。
    # lumen 观测 API 同域反代到 overlay 的 observation（lumen/docker-compose.yml，
    # 网络别名 lumen-observation）。前端 lumenBase=/lumen、实际请求都在 /lumen/api/** 下，
    # 只代理 /lumen/api/（剥 /lumen 前缀），/lumen/lookup 等 SPA 路由留给前端兜底——
    # 与 superadmin 仓 vite dev 代理（只代理 /lumen/api）一致。
    # 同样必须「变量 + resolver」动态解析：overlay 独立于业务栈重建，静态解析会 502。
    location /lumen/api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $lumen_upstream lumen-observation;
        rewrite ^/lumen/(.*)$ /$1 break;
        proxy_pass http://$lumen_upstream:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        client_max_body_size 20m;
    }

    # 深体验区后端（四通道食物秤 + 分组绑定配置）：同域反代到宿主机 8070 的
    # dx-backend（systemd 常驻，非容器）。上游是宿主进程而非 compose 服务，
    # 无法走 127.0.0.11 服务名解析，直接用宿主局域网 IP。
    # ⚠️ 容器→宿主端口受 ufw 管制，需放行 docker 子网（allow from 172.23.0.0/16 to 8070）。
    location /dx-api/ {
        rewrite ^/dx-api/(.*)$ /$1 break;
        proxy_pass http://192.168.100.50:8070;
        # 兜底报告的「AI 估算营养」是一次 LLM 调用，实测 16s+、dx-backend 侧的
        # 转发超时已放宽到 60s（ifa-support #39）——这里必须比它更宽，否则请求在
        # 15s 整被 nginx 掐成 504，控制面看起来就是「点了没用」。
        proxy_read_timeout 90s;
    }

    # 浅体验区控制面 → 宿主机 8060 的 da3-web（app.py，systemd 常驻，非容器）。
    # 同 dx-api：宿主进程直连宿主局域网 IP；ufw 需放行 docker 子网到 8060。
    location /da3-api/ {
        rewrite ^/da3-api/(.*)$ /$1 break;
        proxy_pass http://192.168.100.50:8060;
        proxy_read_timeout 30s;
        client_max_body_size 20m;
    }

    # 识别模型切换 actuator（llm-switch 容器），同域反代避免 CORS；
    # 同样必须「变量 + resolver」动态解析。
    location /ops-api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $ops_upstream llm-switch;
        rewrite ^/ops-api/(.*)$ /$1 break;
        proxy_pass http://$ops_upstream:8095;
        proxy_read_timeout 30s;
    }

    location /admin-api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $services_upstream odyss-services;
        rewrite ^/admin-api/(.*)$ /$1 break;
        proxy_pass http://$services_upstream:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        client_max_body_size 100m;
    }
}
