server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由兜底
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 运行时配置不缓存，改配置立即生效
    location = /superadmin-runtime-config.json {
        add_header Cache-Control "no-store";
    }

    # admin API 同域反代到 services，零 CORS。
    # 上游必须写成「变量 + Docker 内置 DNS resolver」：静态 proxy_pass 只在 nginx 启动时
    # 解析一次，services 容器重建换 IP 后会一直打旧 IP（502 connection refused），
    # 变量形式让每次请求都按 TTL 重新解析。
    # 上游名用 compose 服务名 odyss-services（而非 container_name），任何栈命名下都成立。
    # lumen 观测 API 同域反代到 overlay 的 observation（lumen/docker-compose.yml，
    # 网络别名 lumen-observation）。前端 lumenBase=/lumen，路径前缀在此剥掉，
    # 与 superadmin 仓 vite dev 代理的 rewrite 规则一致。
    # 同样必须「变量 + resolver」动态解析：overlay 独立于业务栈重建，静态解析会 502。
    location /lumen/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $lumen_upstream lumen-observation;
        rewrite ^/lumen/(.*)$ /$1 break;
        proxy_pass http://$lumen_upstream:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        client_max_body_size 20m;
    }

    location /admin-api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $services_upstream odyss-services;
        rewrite ^/admin-api/(.*)$ /$1 break;
        proxy_pass http://$services_upstream:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        client_max_body_size 100m;
    }
}
